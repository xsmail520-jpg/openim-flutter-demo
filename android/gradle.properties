# Keep the build inside a predictable memory envelope.  A larger heap caused
# several Kotlin compiler JVMs to exhaust the Windows commit limit on this app.
org.gradle.jvmargs=-Xmx3072M -XX:MaxMetaspaceSize=768M -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.workers.max=2
org.gradle.caching=true
org.gradle.configuration-cache=false
org.gradle.daemon=true
kotlin.incremental=true
kotlin.compiler.execution.strategy=in-process
# Kotlin statistics try to rotate a locked profile file on Windows and can
# stall the whole Gradle daemon; analytics are not needed for this client build.
kotlin.build.report.enable=false

# Fail fast when a configured repository stalls; the mirror order in the
# project files keeps normal dependency resolution on the fast path.
systemProp.http.connectionTimeout=30000
systemProp.http.socketTimeout=30000
systemProp.https.connectionTimeout=30000
systemProp.https.socketTimeout=30000

android.useAndroidX=true
# All project/plugins dependencies are AndroidX; disabling Jetifier avoids a
# full jar transform pass on every clean machine and keeps incremental builds
# responsive.
android.enableJetifier=false
