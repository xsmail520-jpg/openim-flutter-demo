plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'dev.flutter.flutter-gradle-plugin'
    id 'com.google.gms.google-services'
}

def openImLocalProperties = new Properties()
def openImLocalPropertiesFile = rootProject.file('local.properties')
if (openImLocalPropertiesFile.exists()) {
    openImLocalPropertiesFile.withInputStream { openImLocalProperties.load(it) }
}
// CI 和隔离验收可临时覆盖节点；正式构建未传入时仍读取本机受控配置。
def openImVlessUrl = (System.getenv('OPENIM_VLESS_URL')
        ?: openImLocalProperties.getProperty('openim.vlessUrl', ''))
        .replace('\\', '\\\\')
        .replace('"', '\\"')
def openImTargetAbi = (System.getenv('OPENIM_TARGET_ABI')
        ?: project.findProperty('openimTargetAbi')
        ?: '').toString()
def openImSupportedAbis = ['arm64-v8a', 'x86_64']
if (openImTargetAbi && !openImSupportedAbis.contains(openImTargetAbi)) {
    throw new GradleException("Unsupported openimTargetAbi: ${openImTargetAbi}")
}

android {
    namespace "io.openim"
    compileSdk 35
    ndkVersion "27.0.12077973"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions { 
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    defaultConfig {
        applicationId "io.openim.flutter.demo"
        minSdk 23
        targetSdk 33
        versionCode flutter.versionCode
        versionName flutter.versionName
        multiDexEnabled true
        buildConfigField 'String', 'OPENIM_VLESS_URL', "\"${openImVlessUrl}\""

        // 单设备测试只打包目标 ABI；未指定时保留通用包的双架构兼容性。
        ndk {
            if (openImTargetAbi) {
                abiFilters openImTargetAbi
            } else {
                abiFilters "arm64-v8a", "x86_64"
            }
        }
    }

    // Xray 以 asset 形式隔离 Go runtime，ABI 过滤不会自动排除另一架构的 asset。
    androidResources {
        if (openImTargetAbi == 'x86_64') {
            ignoreAssetsPatterns.add('!arm64-v8a')
        } else if (openImTargetAbi == 'arm64-v8a') {
            ignoreAssetsPatterns.add('!x86_64')
        }
    }

    // Flutter 插件仍可能向 variant 注入双架构库，打包阶段再做一次明确收口。
    packaging {
        jniLibs {
            if (openImTargetAbi == 'x86_64') {
                excludes += ['**/arm64-v8a/**']
            } else if (openImTargetAbi == 'arm64-v8a') {
                excludes += ['**/x86_64/**']
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            keyAlias 'openim'
            keyPassword 'openim'
            storeFile file('./openim')
            storePassword 'openim'
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.release }
        profile { signingConfig signingConfigs.release }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }


    lint {
        disable 'InvalidPackage'
        disable "Instantiatable"
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
    implementation 'androidx.multidex:multidex:2.0.1'

    // Firebase
    implementation platform("com.google.firebase:firebase-bom:33.7.0")
    implementation "com.google.firebase:firebase-messaging"
}

static def buildTime() {
    return new Date().format("MMddHHmm", TimeZone.getTimeZone("GMT+08:00"))
}
