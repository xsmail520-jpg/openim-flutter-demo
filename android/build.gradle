// Android/Kotlin plugin versions are managed centrally in settings.gradle.
// Keeping a second legacy buildscript classpath here makes Gradle resolve two
// plugin generations before it can configure the app.
allprojects {
    afterEvaluate {
        if (project.hasProperty("android")) {
            android {
                compileSdk = 35
                if (project.name == "uri_to_file") {
                    namespace = "in.lazymanstudios.uri_to_file"
                }
            }
        }
    }
    repositories {
        maven { url 'https://maven.aliyun.com/repository/public/' }
        maven { url 'https://maven.aliyun.com/repository/google/' }
        google()
        mavenCentral()
    }
}

def configuredBuildDir = System.getenv('OPENIM_BUILD_ROOT')
if (configuredBuildDir) {
    rootProject.layout.buildDirectory.set(file(configuredBuildDir))
} else {
    rootProject.layout.buildDirectory.set(rootProject.layout.buildDirectory.dir("../../build").get())
}
def newBuildDir = rootProject.layout.buildDirectory.get()

subprojects {
    def newSubprojectBuildDir = newBuildDir.dir(project.name)
    project.layout.buildDirectory.set(newSubprojectBuildDir)
}

subprojects {
    project.evaluationDependsOn(":app")
}

configurations.all {
    resolutionStrategy {
        force 'androidx.core:core-ktx:1.12.0'
        force 'androidx.core:core:1.12.0'
        force 'androidx.activity:activity:1.8.2'
        force 'androidx.activity:activity-ktx:1.8.2'
        force 'androidx.fragment:fragment:1.6.2'
        force 'androidx.fragment:fragment-ktx:1.6.2'
    }
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}
